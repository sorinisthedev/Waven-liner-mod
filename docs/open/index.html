<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listen on WAVEN</title>
  <meta name="description" content="Open this in WAVEN, the free desktop music player.">
  <meta property="og:title" content="Listen on WAVEN">
  <meta property="og:description" content="Open this in WAVEN, the free desktop music player.">
  <meta property="og:image" content="https://sorinisthedev.github.io/Waven-liner-mod/assets/waven-icon.png">
  <meta name="theme-color" content="#0b0b0e">
  <link rel="icon" href="../assets/waven-icon.png">
  <style>
    :root {
      --bg: #07070a;
      --card: #111116;
      --line: rgba(255, 255, 255, 0.08);
      --text: #f4f4f7;
      --muted: rgba(244, 244, 247, 0.6);
      --accent: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background:
        radial-gradient(60% 50% at 20% 10%, rgba(45, 212, 191, 0.18), transparent 70%),
        radial-gradient(50% 50% at 85% 20%, rgba(99, 102, 241, 0.22), transparent 70%),
        var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px 24px 22px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(17, 17, 22, 0.85);
      backdrop-filter: blur(20px);
      text-align: center;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
    }
    .logo { width: 92px; height: auto; margin: 0 auto 18px; display: block; opacity: 0.95; }
    .cover {
      width: 132px; height: 132px; margin: 0 auto 16px; border-radius: 14px;
      object-fit: cover; display: none; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; overflow-wrap: anywhere; }
    .sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
    .buttons { display: grid; gap: 10px; margin-top: 22px; }
    a.btn {
      display: block; padding: 12px 16px; border-radius: 12px; text-decoration: none;
      font-weight: 600; font-size: 15px; transition: transform 0.1s ease, background 0.15s ease;
    }
    a.btn:active { transform: scale(0.98); }
    .primary { background: var(--accent); color: #0b0b0e; }
    .primary:hover { background: #e9e9ee; }
    .secondary { background: rgba(255, 255, 255, 0.08); color: var(--text); }
    .secondary:hover { background: rgba(255, 255, 255, 0.13); }
    .ghost { color: var(--muted); font-weight: 500; font-size: 13.5px; padding: 6px; }
    .ghost:hover { color: var(--text); }
    .note { margin: 16px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="../assets/waven-logo.png" alt="WAVEN">
    <img class="cover" id="cover" alt="">
    <h1 id="title">Listen on WAVEN</h1>
    <p class="sub" id="subtitle">Open this in WAVEN, the free desktop music player.</p>
    <div class="buttons">
      <a class="btn primary" id="open" href="#">Open in WAVEN</a>
      <a class="btn secondary" href="https://github.com/sorinisthedev/Waven-liner-mod/releases/latest/download/WAVEN-Setup.exe">Download WAVEN</a>
      <a class="btn ghost" id="web" href="#" target="_blank" rel="noopener" hidden>Play it on YouTube Music instead</a>
    </div>
    <p class="note">Don't have WAVEN yet? Download it, open it once, then come back and press Open in WAVEN.<br>No account needed.</p>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var types = { track: /^[A-Za-z0-9_-]{11}$/, album: /^MPRE[A-Za-z0-9_-]{4,64}$/, artist: /^UC[A-Za-z0-9_-]{22}$/, playlist: /^[A-Za-z0-9_-]{8,64}$/ };
      var type = params.get("type") || "track";
      var id = params.get("id") || "";
      if (type === "import") return showSharedPlaylist(params.get("d") || "");
      if (!types[type] || !types[type].test(id)) return;

      var title = (params.get("t") || "").slice(0, 100);
      var artist = (params.get("a") || "").slice(0, 80);
      if (title) {
        document.getElementById("title").textContent = title;
        document.getElementById("subtitle").textContent = artist ? artist : "Listen on WAVEN";
        document.title = title + (artist ? " - " + artist : "") + " | WAVEN";
      }
      if (type === "track") {
        var cover = document.getElementById("cover");
        cover.src = "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg";
        cover.onload = function () { cover.style.display = "block"; };
      }

      var deeplink = "waven://" + type + "?id=" + encodeURIComponent(id);
      var open = document.getElementById("open");
      open.href = deeplink;

      var web = {
        track: "https://music.youtube.com/watch?v=" + id,
        album: "https://music.youtube.com/browse/" + id,
        artist: "https://music.youtube.com/channel/" + id,
        playlist: "https://music.youtube.com/playlist?list=" + id.replace(/^VL/, ""),
      }[type];
      var webLink = document.getElementById("web");
      webLink.href = web;
      webLink.hidden = false;

      // try once automatically; the browser asks before opening WAVEN
      setTimeout(function () { location.href = deeplink; }, 600);
    })();

    // shared playlists carry their songs inside the link, no server involved
    function showSharedPlaylist(data) {
      if (!/^1\.[A-Za-z0-9_-]{4,40000}$/.test(data)) return;
      var deeplink = "waven://import?id=" + data;
      document.getElementById("open").href = deeplink;
      document.getElementById("open").textContent = "Add to WAVEN";
      document.getElementById("title").textContent = "Shared playlist";
      document.getElementById("subtitle").textContent = "Open it in WAVEN to add it to your library.";
      try {
        var b64 = data.slice(2).replace(/-/g, "+").replace(/_/g, "/");
        var bin = atob(b64 + "===".slice((b64.length + 3) % 4));
        var bytes = Uint8Array.from(bin, function (c) { return c.charCodeAt(0); });
        var input = new ReadableStream({ start: function (c) { c.enqueue(bytes); c.close(); } });
        new Response(input.pipeThrough(new DecompressionStream("deflate-raw"))).text().then(function (text) {
          var p = JSON.parse(text);
          var ids = Array.isArray(p.i) ? p.i.filter(function (x) { return typeof x === "string"; }) : [];
          var name = typeof p.t === "string" && p.t.trim() ? p.t.trim().slice(0, 100) : "Shared playlist";
          document.getElementById("title").textContent = name;
          document.getElementById("subtitle").textContent = ids.length + (ids.length === 1 ? " song" : " songs") + " · open it in WAVEN to add it to your library";
          document.title = name + " | WAVEN";
          var yt = ids.filter(function (x) { return /^[A-Za-z0-9_-]{11}$/.test(x); });
          if (yt.length) {
            var cover = document.getElementById("cover");
            cover.src = "https://i.ytimg.com/vi/" + yt[0] + "/hqdefault.jpg";
            cover.onload = function () { cover.style.display = "block"; };
            var web = document.getElementById("web");
            web.href = "https://www.youtube.com/watch_videos?video_ids=" + yt.slice(0, 50).join(",");
            web.textContent = "Play it on YouTube instead";
            web.hidden = false;
          }
        }).catch(function () {});
      } catch (e) {}
      setTimeout(function () { location.href = deeplink; }, 600);
    }
  </script>
</body>
</html>
